name: build

on:
  push:
    branches: [main]
    # a tag like v0.1.0 makes a release with every download
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        # Linux on the older Ubuntu: an AppImage built there runs on more systems
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep line ends as they are (libtcod applies patches)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: SDL needs these on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release -R "k5|net|music" --output-on-failure
      - name: Gather
        shell: bash
        run: |
          mkdir -p dist/Pyreheart
          if [ "$RUNNER_OS" = "Windows" ]; then cp build/Release/pyreheart.exe dist/Pyreheart/; else cp build/pyreheart dist/Pyreheart/; fi
          cp -r assets dist/Pyreheart/
          cp README.md dist/Pyreheart/ || true
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy packaging/appimage.sh
          packaging/appimage.sh build ./linuxdeploy
          mkdir -p appimage && mv Pyreheart-x86_64.AppImage appimage/
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip ../Pyreheart-windows.zip Pyreheart > /dev/null
          elif [ "$RUNNER_OS" = "macOS" ]; then zip -qry ../Pyreheart-macos.zip Pyreheart; fi
      - uses: actions/upload-artifact@v4
        with:
          name: pyreheart-${{ runner.os }}
          path: dist
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: pyreheart-zip-${{ runner.os }}
          path: Pyreheart-*.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: pyreheart-appimage
          path: appimage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # keep Gradle's downloads between runs: fewer trips to Maven Central, which sometimes says "too many requests"
          cache: gradle
      - name: NDK and the runner's own CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get install -y ninja-build
          CM=$(dirname "$(dirname "$(command -v cmake)")")
          [ -x "$CM/bin/ninja" ] || sudo ln -sf "$(command -v ninja)" "$CM/bin/ninja"
          echo "cmake.dir=$CM" > android/local.properties
          echo "CMAKE_VERSION=$(cmake --version | head -1 | cut -d' ' -f3)" >> "$GITHUB_ENV"
      - name: Build phone and watch apps
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assemblePhoneRelease assembleWearRelease -PcmakeVersion=$CMAKE_VERSION
      - name: Gather
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/phone/release/*.apk dist/pyreheart-phone.apk
          cp android/app/build/outputs/apk/wear/release/*.apk dist/pyreheart-wear.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pyreheart-android
          path: dist

  # the newest phone and watch apps as plain downloads, so a phone can fetch them without unzipping
  latest:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyreheart-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pyreheart-appimage
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: pyreheart-zip-*
          merge-multiple: true
          path: dist
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest dist/*.apk dist/*.AppImage dist/*.zip -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Built from ${GITHUB_SHA::7}. pyreheart-wear.apk is for the watch, pyreheart-phone.apk for a phone, Pyreheart-x86_64.AppImage for Linux (make it executable and run it), Pyreheart-windows.zip and Pyreheart-macos.zip for Windows and a Mac."

  # a tag like v0.1.0: a release for players, with the game for Windows, Mac, Linux and Android phones
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pyreheart-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pyreheart-appimage
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: pyreheart-zip-*
          merge-multiple: true
          path: dist
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF_NAME}
          cd dist
          mv pyreheart-phone.apk Pyreheart-$V-android.apk
          mv Pyreheart-x86_64.AppImage Pyreheart-$V-linux-x86_64.AppImage
          mv Pyreheart-windows.zip Pyreheart-$V-windows.zip
          mv Pyreheart-macos.zip Pyreheart-$V-macos.zip
          rm -f pyreheart-wear.apk
          NOTES=../packaging/release-notes.md
          gh release create "$V" Pyreheart-$V-* -R "$GITHUB_REPOSITORY" --title "Pyreheart $V" --notes-file "$NOTES" --verify-tag
